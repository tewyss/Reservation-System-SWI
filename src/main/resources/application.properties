# Default profile: H2 in-memory database (no external DB required).
# For a real PostgreSQL run, start the app with:  --spring.profiles.active=postgres
spring.datasource.url=jdbc:h2:mem:reservations;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 web console at http://localhost:8080/h2-console (dev only)
spring.h2.console.enabled=true

# --- Approval workflow (Baseline v0.2) ---
# BR-10 / assumption A-7: the approval window is CONFIGURATION, not a business
# constant - no stakeholder supplied a figure. The invariant part of BR-10
# (deadline <= reservation start) does not depend on this value.
reservation.approval.window=PT24H
# A-12: the sweep's frequency is operational. Correctness does not depend on it
# (outcome G2: an overdue request is expired lazily on the next approval attempt).
reservation.approval.sweep.enabled=true
reservation.approval.sweep-interval=PT5M
