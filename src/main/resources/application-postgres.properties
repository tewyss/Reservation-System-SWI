# PostgreSQL profile for real/production runs.
# Start a database first, e.g.:
#   docker run --name swi-pg -e POSTGRES_DB=reservations -e POSTGRES_USER=swi \
#     -e POSTGRES_PASSWORD=swi -p 5432:5432 -d postgres:16
# Then run:  mvn spring-boot:run -Dspring-boot.run.profiles=postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/reservations
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=swi
spring.datasource.password=swi

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.h2.console.enabled=false
