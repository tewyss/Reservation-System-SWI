# Test configuration: a shared in-memory H2 (PostgreSQL mode) so that the
# concurrency example V-03.9 really runs several transactions against one
# database, and visible SQL so the persistence spike shows the round-trip.
spring.datasource.url=jdbc:h2:mem:swi_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;LOCK_TIMEOUT=30000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=16

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=create-drop

# The verification examples drive OP-07 explicitly and control the clock, so the
# background sweep is off - otherwise it would race the boundary examples.
reservation.approval.sweep.enabled=false
reservation.approval.window=PT24H
